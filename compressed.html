<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>1D Combat</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#000}canvas{width:100vw;height:100vh;display:block}</style><canvas id=c width=800 height=600></canvas><script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),p={x:390,y:290,s:20,h:3,vx:0,vy:0,i:0,d:0},L=[],W=[],K={};let t=0,last=0,next=700;
onkeydown=e=>{K[e.key.toLowerCase()]=1;if(over&&(/enter|r/i.test(e.key)))location.reload()};onkeyup=e=>K[e.key.toLowerCase()]=0;
function hit(){p.h--;p.i=900;if(!p.h)over=1}
function spawn(){let q=~~(Math.random()*4),z=q%2?c.height:c.width;W.push([q,Math.random()*z,700]);next=500+Math.random()*1800}
function loop(now){let dt=Math.min(now-last,50);last=now;t+=dt;let f=dt/16.7;if(!over){next-=dt;if(next<0)spawn();p.i=Math.max(0,p.i-dt);let a=(K.d?1:0)-(K.a?1:0),b=(K.s?1:0)-(K.w?1:0),n=Math.hypot(a,b)||1;p.vx+=a/n*.8*f;p.vy+=b/n*.8*f;p.d=Math.max(0,p.d-dt);if(K[' ']&&p.d<1){p.vx+=a/n*35;p.vy+=b/n*35;p.d=450}p.x+=p.vx*f;p.y+=p.vy*f;p.vx*=.82**f;p.vy*=.82**f;p.x=Math.max(0,Math.min(c.width-p.s,p.x));p.y=Math.max(0,Math.min(c.height-p.s,p.y));for(let i=W.length;i--;){let q=W[i];q[2]-=dt;if(q[2]<0){L.push([q[0],q[1],0]);W.splice(i,1)}}for(let i=L.length;i--;){let q=L[i],z=Math.min(1,(L[i][2]+=dt)/1000),hitline=q[0]%2?(q[0]==1?c.width*(1-z):c.width*z):(q[0]==0?c.height*z:c.height*(1-z)),near=q[0]%2?p.y<q[1]+10&&p.y+p.s>q[1]-10:p.x<q[1]+10&&p.x+p.s>q[1]-10,there=q[0]%2?(q[0]==1?p.x+p.s>hitline:p.x<hitline):(q[0]==0?p.y< hitline:p.y+p.s>hitline);if(near&&there&&p.i<1){hit();q[2]=2e3}if(q[2]>1250)L.splice(i,1)}}draw();requestAnimationFrame(loop)}
function draw(){x.clearRect(0,0,c.width,c.height);x.lineWidth=3;for(let q of W){x.setLineDash([8,8]);x.strokeStyle='#f44';x.beginPath();q[0]%2?(x.moveTo(0,q[1]),x.lineTo(c.width,q[1])):(x.moveTo(q[1],0),x.lineTo(q[1],c.height));x.stroke()}x.setLineDash([]);for(let q of L){let z=Math.min(1,q[2]/1000);x.strokeStyle='#f22';x.shadowBlur=18;x.shadowColor='red';x.lineWidth=8;x.beginPath();q[0]==0?(x.moveTo(q[1],0),x.lineTo(q[1],c.height*z)):q[0]==1?(x.moveTo(c.width,q[1]),x.lineTo(c.width*(1-z),q[1])):q[0]==2?(x.moveTo(q[1],c.height),x.lineTo(q[1],c.height*(1-z))):(x.moveTo(0,q[1]),x.lineTo(c.width*z,q[1]));x.stroke()}x.shadowBlur=14;x.fillStyle=p.d?'orange':'white';if(p.i%160<80)x.fillRect(p.x,p.y,p.s,p.s);x.shadowBlur=0;x.fillStyle='#f55';x.font='22px sans-serif';x.fillText('♥'.repeat(p.h),c.width/2-32,30);if(over){x.fillStyle='#000b';x.fillRect(0,0,c.width,c.height);x.fillStyle='#f55';x.textAlign='center';x.font='bold 52px sans-serif';x.fillText('YOU DIED',c.width/2,c.height/2);x.font='18px sans-serif';x.fillText('ENTER or R to restart',c.width/2,c.height/2+38);x.textAlign='left'}}let over=0;requestAnimationFrame(loop)
</script>
</body.
