<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Visualizer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .controls {
            position: fixed;
            top: 50%;
            left: 50%;
            display: grid;
            gap: 12px;
            justify-items: center;
            padding: 18px 22px;
            transform: translate(-50%, -50%);
            color: #fff;
            font: 15px Arial, sans-serif;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 10px;
        }

        .upload-label {
            padding: 10px 16px;
            color: #000;
            font-weight: bold;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
        }

        .upload-label input {
            display: none;
        }

        .color-label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-label input {
            width: 42px;
            height: 28px;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
        }

        #audioName {
            max-width: 240px;
            margin: 0;
            overflow: hidden;
            color: rgba(255, 255, 255, 0.75);
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <canvas id="visualizer" width="800" height="600"></canvas>
    <div class="controls">
        <label class="upload-label">
            Upload audio
            <input id="audioUpload" type="file" accept="audio/*">
        </label>
        <label class="color-label">
            Visualizer color
            <input id="colorPicker" type="color" value="#ff7500">
        </label>
        <p id="audioName">Choose an audio file to begin</p>
    </div>
    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const audio = new Audio();
        const audioUpload = document.getElementById('audioUpload');
        const colorPicker = document.getElementById('colorPicker');
        const audioName = document.getElementById('audioName');
        const bufferLength = 128;
        const dataArray = new Uint8Array(bufferLength);
        let audioContext;
        let analyser;
        let audioUrl;

        function startAudio() {
            if (!audioContext) {
                audioContext = new AudioContext();
                const source = audioContext.createMediaElementSource(audio);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser).connect(audioContext.destination);
            }
            audioContext.resume();
            if (audio.src) audio.play();
        }

        window.addEventListener('mousedown', startAudio);
        window.addEventListener('touchstart', startAudio, { passive: true });

        audioUpload.addEventListener('change', () => {
            const [file] = audioUpload.files;
            if (!file) return;
            if (audioUrl) URL.revokeObjectURL(audioUrl);
            audioUrl = URL.createObjectURL(file);
            audio.src = audioUrl;
            audio.load();
            audioName.textContent = file.name;
            startAudio();
        });

        function pointOnFrame(distance, inset, width, height, radius) {
            const straightWidth = width - radius * 2;
            const straightHeight = height - radius * 2;
            const perimeter = straightWidth * 2 + straightHeight * 2 + Math.PI * radius * 2;
            let remaining = distance % perimeter;
            const quarterArc = Math.PI * radius / 2;

            if (remaining <= straightWidth) {
                return { x: inset + radius + remaining, y: inset };
            }
            remaining -= straightWidth;
            if (remaining <= quarterArc) {
                const angle = -Math.PI / 2 + remaining / radius;
                return {
                    x: inset + width - radius + Math.cos(angle) * radius,
                    y: inset + radius + Math.sin(angle) * radius
                };
            }
            remaining -= quarterArc;
            if (remaining <= straightHeight) {
                return { x: inset + width, y: inset + radius + remaining };
            }
            remaining -= straightHeight;
            if (remaining <= quarterArc) {
                const angle = remaining / radius;
                return {
                    x: inset + width - radius + Math.cos(angle) * radius,
                    y: inset + height - radius + Math.sin(angle) * radius
                };
            }
            remaining -= quarterArc;
            if (remaining <= straightWidth) {
                return { x: inset + width - radius - remaining, y: inset + height };
            }
            remaining -= straightWidth;
            if (remaining <= quarterArc) {
                const angle = Math.PI / 2 + remaining / radius;
                return {
                    x: inset + radius + Math.cos(angle) * radius,
                    y: inset + height - radius + Math.sin(angle) * radius
                };
            }
            remaining -= quarterArc;
            if (remaining <= straightHeight) {
                return { x: inset, y: inset + height - radius - remaining };
            }
            const angle = Math.PI + remaining / radius;
            return {
                x: inset + radius + Math.cos(angle) * radius,
                y: inset + radius + Math.sin(angle) * radius
            };
        }

        function drawVisualizer() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (analyser) {
                analyser.getByteFrequencyData(dataArray);
            }

            const barColor = colorPicker.value;
            const inset = 0;
            const radius = Math.min(18, canvas.width / 4, canvas.height / 4);
            const width = canvas.width - inset * 2;
            const height = canvas.height - inset * 2;
            const straightWidth = width - radius * 2;
            const straightHeight = height - radius * 2;
            const perimeter = straightWidth * 2 + straightHeight * 2 + Math.PI * radius * 2;
            const barDepth = Math.min(canvas.width, canvas.height) * 0.12;
            const minimumDepth = 10;
            const barCount = 128;
            const barsPerSide = barCount / 4;

            ctx.beginPath();
            for (let i = 0; i < barCount; i++) {
                const start = pointOnFrame(i * perimeter / barCount, inset, width, height, radius);
                const end = pointOnFrame((i + 1) * perimeter / barCount, inset, width, height, radius);
                const patternIndex = i % barsPerSide;
                const signal = analyser
                    ? (dataArray[patternIndex] + dataArray[patternIndex + barsPerSide] +
                        dataArray[patternIndex + barsPerSide * 2] + dataArray[patternIndex + barsPerSide * 3]) / 4
                    : 0;
                const depth = minimumDepth + signal / 255 * barDepth;
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const startLength = Math.hypot(start.x - centerX, start.y - centerY) || 1;
                const endLength = Math.hypot(end.x - centerX, end.y - centerY) || 1;
                const startInner = {
                    x: start.x + (centerX - start.x) / startLength * depth,
                    y: start.y + (centerY - start.y) / startLength * depth
                };
                const endInner = {
                    x: end.x + (centerX - end.x) / endLength * depth,
                    y: end.y + (centerY - end.y) / endLength * depth
                };

                ctx.moveTo(start.x, start.y);
                ctx.lineTo(end.x, end.y);
                ctx.lineTo(endInner.x, endInner.y);
                ctx.lineTo(startInner.x, startInner.y);
                ctx.closePath();
            }

            ctx.fillStyle = barColor;
            ctx.shadowBlur = 18;
            ctx.shadowColor = barColor;
            ctx.fill();
            ctx.shadowBlur = 0;
            requestAnimationFrame(drawVisualizer);
        }

        drawVisualizer();
    </script>
</body>
</html>
