<!-- 1D Combat - orginal file before compression to 3 kb for shrink -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1D Combat</title>
    <style> 
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            border: 1px solid #fff;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>   
        // audio engine (was compacted by ai)
        let c,e=new Audio('Rift-breaker-tds.mp3'),a=(m,t=0)=>{e.pause();e.currentTime=t;if(m)e.play()};window.addEventListener('click',()=>{if(!c){c=new AudioContext();c.createMediaElementSource(e).connect(c.destination);if(e.dataset.q)a(1)}},{once:true});const Music={play:()=>!c?e.dataset.q=1:(c.resume(),e.play()),pause:()=>e.pause(),stop:()=>a(0),restart:()=>a(1)};
        // play music on first click
        window.addEventListener('mousedown',()=>{Music.play()},{once:false});
    </script>
    <script>   
        // setup the game canvas
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const player = { x: canvas.width / 2, y: canvas.height / 2, size: 20, color: 'white' };
        const movementmulti = 4;
        // player movement 
         const keys = {'w': false, 'a': false, 's': false, 'd': false};
        document.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        document.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });
        function updatePlayer() {
            if (keys['w']) player.y -= 2 * movementmulti;
            if (keys['s']) player.y += 2 * movementmulti;
            if (keys['a']) player.x -= 2 * movementmulti;
            if (keys['d']) player.x += 2 * movementmulti;
            // keep player within bounds
            player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));
        }
        function drawPlayer() {
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.size, player.size);
        }
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            updatePlayer();
            drawPlayer();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
        // add a smooth trail behind the player
        const trail = [];
        function updateTrail() {
            trail.push({ x: player.x, y: player.y });
            if (trail.length > 20) trail.shift();
        }
        function drawTrail() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            for (let i = 0; i < trail.length; i++) {
                const point = trail[i];
                ctx.fillRect(point.x, point.y, player.size, player.size);
            }
        }
        function gameLoopWithTrail() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            updatePlayer();
            updateTrail();
            drawTrail();
            drawPlayer();
            requestAnimationFrame(gameLoopWithTrail);
        }
        gameLoopWithTrail();
    </script>
