<!-- 1D Combat - orginal file before compression to 3 kb for shrink -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1D Combat</title>
    <style> 
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            border: 1px solid #fff;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script>   
        // audio engine (was compacted by ai)
        let c,e=new Audio('Rift-breaker-tds.mp3'),a=(m,t=0)=>{e.pause();e.currentTime=t;if(m)e.play()};window.addEventListener('click',()=>{if(!c){c=new AudioContext();c.createMediaElementSource(e).connect(c.destination);if(e.dataset.q)a(1)}},{once:true});const Music={play:()=>!c?e.dataset.q=1:(c.resume(),e.play()),pause:()=>e.pause(),stop:()=>a(0),restart:()=>a(1)};
        // play music on first click
        window.addEventListener('mousedown',()=>{Music.play()},{once:false});
    </script>
    <script>   
        // setup the game canvas
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: 20,
            color: 'white',
            vx: 0,
            vy: 0,
            dashCooldown: 0,
            dashTimer: 0
        };
        const movementmulti = 4;
        const acceleration = 0.8;
        const maxSpeed = 8;
        const friction = 0.82;
        const dashSpeed = 40;
        const dashDuration = 140;
        const dashCooldownTime = 450;
        const keys = {'w': false, 'a': false, 's': false, 'd': false, 'Shift': false};
        let dashRequested = false;
        document.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
            if (e.key === 'Shift' && !e.repeat) dashRequested = true;
        });
        document.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });
        function updatePlayer() {
            let directionX = 0;
            let directionY = 0;
            if (keys['w']) directionY -= 1;
            if (keys['s']) directionY += 1;
            if (keys['a']) directionX -= 1;
            if (keys['d']) directionX += 1;

            const directionLength = Math.hypot(directionX, directionY) || 1;
            directionX /= directionLength;
            directionY /= directionLength;

            player.vx += directionX * acceleration;
            player.vy += directionY * acceleration;
            const speed = Math.hypot(player.vx, player.vy);
            if (speed > maxSpeed) {
                player.vx = (player.vx / speed) * maxSpeed;
                player.vy = (player.vy / speed) * maxSpeed;
            }

            if (dashRequested && player.dashCooldown <= 0 && (directionX || directionY)) {
                player.vx += directionX * dashSpeed;
                player.vy += directionY * dashSpeed;
                player.dashCooldown = dashCooldownTime;
                player.dashTimer = dashDuration;
            }
            dashRequested = false;
            player.dashCooldown = Math.max(0, player.dashCooldown - 16.67);
            player.dashTimer = Math.max(0, player.dashTimer - 16.67);

            player.x += player.vx;
            player.y += player.vy;
            player.vx *= friction;
            player.vy *= friction;

            // keep player within bounds
            if (player.x <= 0 || player.x >= canvas.width - player.size) player.vx = 0;
            if (player.y <= 0 || player.y >= canvas.height - player.size) player.vy = 0;
            player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));
        }
        function drawPlayer() {
            ctx.fillStyle = player.dashTimer > 0 ? 'orange' : player.color;
            ctx.fillRect(player.x, player.y, player.size, player.size);
        }
        const trail = [];
        function updateTrail() {
            trail.push({
                x: player.x + player.size / 2,
                y: player.y + player.size / 2
            });
            if (trail.length > 32) trail.shift();
        }
        function drawTrail() {
            if (trail.length < 2) return;

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = player.size * 0.75;

            for (let i = 1; i < trail.length; i++) {
                const start = trail[i - 1];
                const end = trail[i];
                const opacity = (i / trail.length) * 0.35;

                ctx.beginPath();
                ctx.moveTo(start.x, start.y);
                ctx.lineTo(end.x, end.y);
                ctx.strokeStyle = `rgba(255, 255, 255, ${opacity})`;
                ctx.stroke();
            }
        }
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            updatePlayer();
            updateTrail();
            drawTrail();
            drawPlayer();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
